name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token trusted publishing exchanges for a temporary NuGet key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/Digi21.WinUI.Docking/Digi21.WinUI.Docking.csproj -c Release --no-build -o artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
